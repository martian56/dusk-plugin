# Installing this repository with :plugin install gives the TODO finder
# example; the package itself is the SDK.
name = "todo"
version = "0.2.0"
description = "List TODO and FIXME lines in a panel"
command = "./todo"
activation = ["startup"]
build = ["raven", "build", "examples/todo.rv", "-o", "todo"]

[windows]
command = "./todo.exe"
build = ["raven", "build", "examples/todo.rv", "-o", "todo.exe"]
